<nav class="sidebar" [class.sidebar--collapsed]="collapsed()">

  
  <button
    class="sidebar__toggle"
    (click)="toggleCollapse()"
    [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'"
    [attr.aria-expanded]="!collapsed()"
    title="{{ collapsed() ? 'Expandir' : 'Colapsar' }}"
  >
    <span class="toggle-icon">{{ collapsed() ? '»' : '«' }}</span>
  </button>

  
  <div class="sidebar__brand">
    <span class="brand-icon">🛡️</span>
    @if (!collapsed()) {
      <span class="brand-text">CyberGuard</span>
    }
  </div>

  
  <ul class="sidebar__nav" role="navigation" aria-label="Menú principal">
    @for (item of visibleItems(); track item.route) {
      <li class="sidebar__item">
        <a
          [routerLink]="item.route"
          routerLinkActive="sidebar__link--active"
          class="sidebar__link"
          [title]="item.label"
          [attr.aria-label]="item.label"
        >
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          @if (!collapsed()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>

  
  <div class="sidebar__footer">
    @if (!collapsed()) {
      <div class="user-info">
        <span class="user-username">{{ currentUser()?.username }}</span>
        <span class="user-role">{{ currentUser()?.role }}</span>
      </div>
    }
    <button (click)="logout()" class="btn-logout" title="Cerrar Sesión">
      <span aria-hidden="true">🚪</span>
      @if (!collapsed()) {
        <span>Cerrar Sesión</span>
      }
    </button>
  </div>

</nav>
