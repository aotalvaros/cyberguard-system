<div class="dashboard-root">
  <header class="dash-header">
    <h1>Admin Dashboard</h1>
    <div class="actions">
      <button class="btn btn-danger" (click)="clearAll()">Clear All</button>
      <button class="btn" (click)="logout()">Logout</button>
    </div>
  </header>

  <section class="report">
    <h2>Manual incident report</h2>
    <form [formGroup]="form" (ngSubmit)="submitThreat()" class="report-form">
      <label>
        Type
        <select formControlName="type">
          <option value="malware">Malware</option>
          <option value="intrusion">Intrusion</option>
          <option value="phishing">Phishing</option>
          <option value="ddos">DDoS</option>
          <option value="ransomware">Ransomware</option>
        </select>
      </label>

      <label>
        Severity
        <select formControlName="severity">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </label>

      <label>
        Source IP
        <input type="text" formControlName="sourceIp" placeholder="e.g. 192.168.1.10" [class.invalid]="getControl('sourceIp')?.invalid && getControl('sourceIp')?.touched" />
        <small class="field-error" *ngIf="getControl('sourceIp')?.invalid && getControl('sourceIp')?.touched">Enter a valid IPv4 address.</small>
      </label>

      <label>
        Target IP (optional)
        <input type="text" formControlName="targetIp" placeholder="e.g. 10.0.0.5" [class.invalid]="getControl('targetIp')?.invalid && getControl('targetIp')?.touched" />
        <small class="field-error" *ngIf="getControl('targetIp')?.invalid && getControl('targetIp')?.touched">Enter a valid IPv4 address.</small>
      </label>

      <label class="full">
        Description
        <textarea rows="3" formControlName="description" placeholder="Describe the incident..." [class.invalid]="getControl('description')?.invalid && getControl('description')?.touched"></textarea>
        <small class="field-error" *ngIf="getControl('description')?.invalid && getControl('description')?.touched">Use 10-500 characters.</small>
      </label>

      <div class="form-actions full">
        <button class="btn" type="submit" [disabled]="submitting">Submit report</button>
        <span class="status error" *ngIf="formError">{{ formError }}</span>
        <span class="status success" *ngIf="formSuccess">{{ formSuccess }}</span>
      </div>
    </form>
  </section>

  <section class="feed">
    <div *ngIf="messages.length === 0" class="empty">No messages yet — waiting for events...</div>
    <div *ngFor="let m of messages; let i = index" class="card">
      <div class="card-header">
        <div class="meta">
          <span class="tag">{{ m.routingKey || m.routing || m.payload?.routingKey }}</span>
          <time>{{ m.receivedAt || m.timestamp }}</time>
        </div>
        <button class="btn-delete" (click)="deleteMessage(i)" title="Delete">×</button>
      </div>
      <pre class="payload">{{ m | json }}</pre>
    </div>
  </section>
</div>
