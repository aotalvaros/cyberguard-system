<div class="auth-wrapper">
  <div class="card">
    <div class="card-header">
      <div class="logo">CG</div>
      <div class="titles">
        <h2>Sign in</h2>
        <p class="subtitle">Access your CyberGuard account</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
      <div class="field">
        <label>
          <span class="label-text">Usuario</span>
          <div class="input-with-icon">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 21v-1c0-2.761 4.477-5 9-5s9 2.239 9 5v1" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input formControlName="username" placeholder="Your username" autocomplete="username" />
          </div>
        </label>
      </div>

      <div class="field">
        <label>
          <span class="label-text">Contraseña</span>
          <div class="input-with-icon">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="11" rx="2" stroke="#6b7280" stroke-width="1.2"/><path d="M7 11V8a5 5 0 0110 0v3" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password" autocomplete="current-password" />
            <button type="button" class="toggle" (click)="togglePassword()" aria-label="Toggle password">{{ showPassword ? 'Hide' : 'Show' }}</button>
          </div>
        </label>
      </div>

      <div class="extras">
        <label class="remember"><input type="checkbox" formControlName="remember" /> Remember me</label>
        <a class="forgot" routerLink="/">Forgot password?</a>
      </div>

      <div class="actions">
        <button class="primary" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Sign in</span>
          <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
        </button>
      </div>
    </form>

    <div *ngIf="error" class="message error" role="alert" aria-live="assertive">{{ error }}</div>
    <div *ngIf="success" class="message success">{{ success }}</div>
  </div>
</div>
