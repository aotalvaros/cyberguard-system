name: CI/CD Pipeline - CyberGuard Monorepo

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ============================================
# JOB 0: Detectar qué cambió
# ============================================
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      worker: ${{ steps.filter.outputs.worker }}
      infra: ${{ steps.filter.outputs.infra }}
      qa: ${{ steps.filter.outputs.qa }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/cyberguard-system-appv2/**'
            backend:
              - 'backend/producer/**'
            worker:
              - 'backend/worker/**'
            infra:
              - 'docker-compose.yml'
              - '.github/workflows/**'
            qa:
              - 'QA/**'
              - 'docs/QA_EVIDENCE.md'
              - 'FEEDBACK_*.md'

  # ============================================
  # JOB 1: Lint & Build (Condicional)
  # ============================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/cyberguard-system-appv2/package-lock.json
      
      - name: Install Dependencies
        working-directory: frontend/cyberguard-system-appv2
        run: npm ci
      
      - name: Lint
        working-directory: frontend/cyberguard-system-appv2
        run: npm run lint --if-present
      
      - name: Build
        working-directory: frontend/cyberguard-system-appv2
        run: npm run build

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/producer/package-lock.json
      
      - name: Install Dependencies
        working-directory: backend/producer
        run: npm ci
      
      - name: Lint
        working-directory: backend/producer
        run: npm run lint --if-present
      
      - name: Build
        working-directory: backend/producer
        run: npm run build

  lint-worker:
    name: Lint Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/worker/package-lock.json
      
      - name: Install Dependencies
        working-directory: backend/worker
        run: npm ci
      
      - name: Lint
        working-directory: backend/worker
        run: npm run lint --if-present
      
      - name: Build
        working-directory: backend/worker
        run: npm run build

  # ============================================
  # JOB 2: Unit Tests - Componente (Caja Blanca)
  # ============================================
  unit-tests-frontend:
    name: Unit Tests Frontend (Component)
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Dependencies
        working-directory: frontend/cyberguard-system-appv2
        run: npm ci
      
      - name: Run Unit Tests
        working-directory: frontend/cyberguard-system-appv2
        run: npm run test:ci
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/cyberguard-system-appv2/coverage
          flags: frontend-unit

  unit-tests-backend:
    name: Unit Tests Backend (Component)
    runs-on: ubuntu-latest
    needs: [changes, lint-backend]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Dependencies
        working-directory: backend/producer
        run: npm ci
      
      - name: Run Unit Tests
        working-directory: backend/producer
        env:
          # Variables requeridas para tests
          PORT: 3000
          RABBITMQ_URL: amqp://localhost:5672
          JWT_SECRET: test-secret-for-ci-only
          FIREBASE_API_KEY: fake-api-key-for-testing
          FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          FIREBASE_PROJECT_ID: test-project-id
          NODE_ENV: test
        run: npm run test:ci
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/producer/coverage
          flags: backend-unit

  unit-tests-worker:
    name: Unit Tests Worker (Component)
    runs-on: ubuntu-latest
    needs: [changes, lint-worker]
    if: |
      always() &&
      needs.changes.outputs.worker == 'true' &&
      (needs.lint-worker.result == 'success' || needs.lint-worker.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Dependencies
        working-directory: backend/worker
        run: npm ci
      
      - name: Run Unit Tests
        working-directory: backend/worker
        run: npm run test:ci

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/worker/coverage
          flags: worker-unit

  # ============================================
  # JOB 3: Integration Tests (Black Box)
  # ============================================
  
  # 3.1 Backend Integration Tests
  integration-tests-backend:
    name: Integration Tests Backend (Black Box)
    runs-on: ubuntu-latest
    needs: [changes, unit-tests-backend]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.unit-tests-backend.result == 'success' || needs.unit-tests-backend.result == 'skipped')
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cyberguard_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Backend
        working-directory: backend/producer
        run: npm ci

      - name: Run DB Migrations
        working-directory: backend/producer
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cyberguard_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
          if [ -f "migrations/001_initial_schema.sql" ]; then
            PGPASSWORD=test psql -h localhost -U test -d cyberguard_test -f migrations/001_initial_schema.sql
          fi

      - name: Run Integration Tests (Caja Negra)
        working-directory: backend/producer
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cyberguard_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_SECRET: test-secret-key-for-ci
          FIREBASE_API_KEY: fake-api-key-for-testing
          FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          FIREBASE_PROJECT_ID: test-project-id
          NODE_ENV: test
        run: npm test -- --testPathPattern="integration"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/producer/coverage
          flags: backend-integration

  # 3.2 Worker Integration Tests (Not Implemented - Skip)
  integration-tests-worker:
    name: Integration Tests Worker (Not Implemented)
    runs-on: ubuntu-latest
    needs: [changes, unit-tests-worker]
    if: |
      always() &&
      needs.changes.outputs.worker == 'true' &&
      (needs.unit-tests-worker.result == 'success' || needs.unit-tests-worker.result == 'skipped')
    
    steps:
      - name: Skip Worker Integration Tests
        run: |
          echo "INFO: Worker integration tests not yet implemented"
          echo "OK: Worker has unit tests with high coverage"
          echo "NOTE: Integration tests will be added in future iterations"
          exit 0

  # 3.3 Frontend Integration Tests (E2E)
  integration-tests-frontend:
    name: Integration Tests Frontend (E2E)
    runs-on: ubuntu-latest
    needs: [changes, unit-tests-frontend]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.unit-tests-frontend.result == 'success' || needs.unit-tests-frontend.result == 'skipped')
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend
        working-directory: frontend/cyberguard-system-appv2
        run: npm ci

      - name: Run E2E or Integration Tests
        working-directory: frontend/cyberguard-system-appv2
        env:
          API_URL: http://localhost:3000
          WS_URL: ws://localhost:8081
        run: |
          if npm run | grep -q "test:e2e"; then
            npm run test:e2e
          elif npm run | grep -q "test:integration"; then
            npm run test:integration
          else
            echo "INFO: E2E tests not yet configured"
            echo "OK: Frontend has unit tests validated"
            echo "NOTE: E2E tests with Cypress or Playwright will be added in future iterations"
            exit 0
          fi

  # ============================================
  # JOB 4: Security Scan (Trivy con SARIF)
  # ============================================
  security-scan-frontend:
    name: Security Scan Frontend
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped')
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t cyberguard-frontend:scan ./frontend/cyberguard-system-appv2
      
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberguard-frontend:scan
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'
      
      - name: NPM Audit
        working-directory: frontend/cyberguard-system-appv2
        run: npm audit --audit-level=high || true

  security-scan-backend:
    name: Security Scan Backend
    runs-on: ubuntu-latest
    needs: [changes, lint-backend]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped')
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t cyberguard-backend:scan ./backend/producer
      
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberguard-backend:scan
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'
      
      - name: NPM Audit
        working-directory: backend/producer
        run: npm audit --audit-level=high || true

  security-scan-worker:
    name: Security Scan Worker
    runs-on: ubuntu-latest
    needs: [changes, lint-worker]
    if: |
      always() &&
      needs.changes.outputs.worker == 'true' &&
      (needs.lint-worker.result == 'success' || needs.lint-worker.result == 'skipped')
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t cyberguard-worker:scan ./backend/worker
      
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberguard-worker:scan
          format: 'sarif'
          output: 'trivy-worker-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-worker-results.sarif'
          category: 'trivy-worker'
      
      - name: NPM Audit
        working-directory: backend/worker
        run: npm audit --audit-level=high || true

  # ============================================
  # JOB 4.5: QA Documentation Validation
  # ============================================
  qa-validation:
    name: QA Documentation Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.qa == 'true'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate TEST_PLAN.md Structure
        run: |
          echo "Validating QA Test Plan..."
          
          # HUMAN CHECK: Archivo principal del equipo QA
          # Debe contener: 7 principios, estrategia multinivel, test suites
          if [ ! -f "QA/TEST_PLAN.md" ]; then
            echo "ERROR: QA/TEST_PLAN.md not found"
            echo ""
            echo "El equipo QA debe crear QA/TEST_PLAN.md con:"
            echo "  1. Los 7 principios del testing (aplicados y justificados)"
            echo "  2. Estrategia de testing multinivel (Componente/Integracion/Sistema)"
            echo "  3. Diferenciacion entre Caja Blanca y Caja Negra"
            echo "  4. Test Suites y Test Cases documentados"
            echo "  5. Criterios de aceptacion"
            exit 1
          fi
          
          # Validar que contiene los 7 principios
          if ! grep -qi "principio" QA/TEST_PLAN.md; then
            echo "WARNING: TEST_PLAN.md might be missing Principios del Testing"
          else
            echo "OK: TEST_PLAN.md contains 'principios'"
          fi
          
          # Validar que menciona Caja Blanca/Negra
          if ! grep -qiE "caja (blanca|negra|white|black)" QA/TEST_PLAN.md; then
            echo "WARNING: TEST_PLAN.md might be missing Caja Blanca/Negra differentiation"
          else
            echo "OK: TEST_PLAN.md mentions testing techniques"
          fi
          
          # Validar que menciona test suites o casos de prueba
          if ! grep -qiE "test (suite|case|casos)" QA/TEST_PLAN.md; then
            echo "WARNING: TEST_PLAN.md might be missing Test Cases/Suites"
          else
            echo "OK: TEST_PLAN.md contains test structure"
          fi
          
          echo "OK: TEST_PLAN.md validation passed"
      
      - name: Validate QA Evidence
        run: |
          echo "Validating QA Test Evidence..."
          
          # Check for evidence documentation
          if [ ! -f "docs/QA_EVIDENCE.md" ]; then
            echo "WARNING: docs/QA_EVIDENCE.md not found"
            echo "   El equipo QA debe documentar evidencia de ejecucion"
          else
            echo "OK: Found docs/QA_EVIDENCE.md"
            
            # Verificar que tiene referencias a imagenes o reportes
            if grep -qiE "(screenshot|imagen|coverage|report|resultado)" docs/QA_EVIDENCE.md; then
              echo "OK: QA_EVIDENCE.md contains test execution references"
            else
              echo "WARNING: QA_EVIDENCE.md might be empty or incomplete"
            fi
          fi
          
          # Check for screenshots/evidence folder
          if [ -d "docs/images/testing" ] || [ -d "QA/evidence" ]; then
            SCREENSHOT_COUNT=$(find docs/images/testing QA/evidence -type f 2>/dev/null | wc -l)
            echo "INFO: Found $SCREENSHOT_COUNT evidence files"
          else
            echo "WARNING: No evidence folder found (docs/images/testing or QA/evidence)"
          fi
      
      - name: Validate Team Feedback
        run: |
          echo "Validating Team Feedback..."
          
          if [ ! -f "FEEDBACK_TEAM-4-QA.md" ]; then
            echo "WARNING: FEEDBACK_TEAM-4-QA.md not found"
          else
            echo "OK: Found FEEDBACK_TEAM-4-QA.md"
          fi
      
      - name: Generate QA Report Summary
        run: |
          echo "## QA Documentation Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check TEST_PLAN.md
          if [ -f "QA/TEST_PLAN.md" ]; then
            PLAN_SIZE=$(wc -l < QA/TEST_PLAN.md)
            echo "OK: **TEST_PLAN.md** - $PLAN_SIZE lines" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: **TEST_PLAN.md** - MISSING (REQUIRED)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check QA_EVIDENCE.md
          if [ -f "docs/QA_EVIDENCE.md" ]; then
            EVIDENCE_SIZE=$(wc -l < docs/QA_EVIDENCE.md)
            echo "OK: **QA_EVIDENCE.md** - $EVIDENCE_SIZE lines" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: **QA_EVIDENCE.md** - Missing (recommended)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check feedback
          if [ -f "FEEDBACK_TEAM-4-QA.md" ]; then
            echo "OK: **FEEDBACK_TEAM-4-QA.md** - Present" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: **FEEDBACK_TEAM-4-QA.md** - Missing" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### QA Folder Contents:" >> $GITHUB_STEP_SUMMARY
          if [ -d "QA" ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            find QA -type f >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: QA folder not found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "INFO: This job validates QA team deliverables per Semana 3 evaluation guide" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Required by QA Team:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`QA/TEST_PLAN.md\` (7 principios, estrategia multinivel, test cases)" >> $GITHUB_STEP_SUMMARY
          echo "- \`docs/QA_EVIDENCE.md\` (screenshots, coverage reports)" >> $GITHUB_STEP_SUMMARY
          echo "- Test execution evidence (images/reports)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 5: Docker Build & Push to GHCR
  # ============================================
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [changes, unit-tests-frontend, unit-tests-backend, unit-tests-worker, integration-tests-backend, integration-tests-worker, integration-tests-frontend, security-scan-frontend, security-scan-backend, security-scan-worker]
    if: |
      always() && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      (needs.unit-tests-frontend.result == 'success' || needs.unit-tests-frontend.result == 'skipped') &&
      (needs.unit-tests-backend.result == 'success' || needs.unit-tests-backend.result == 'skipped') &&
      (needs.unit-tests-worker.result == 'success' || needs.unit-tests-worker.result == 'skipped') &&
      (needs.integration-tests-backend.result == 'success' || needs.integration-tests-backend.result == 'skipped') &&
      (needs.integration-tests-worker.result == 'success' || needs.integration-tests-worker.result == 'skipped') &&
      (needs.integration-tests-frontend.result == 'success' || needs.integration-tests-frontend.result == 'skipped')
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        if: needs.changes.outputs.frontend == 'true'
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and Push Frontend Image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/cyberguard-system-appv2
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Backend
        if: needs.changes.outputs.backend == 'true'
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and Push Backend Image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/producer
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker
        if: needs.changes.outputs.worker == 'true'
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and Push Worker Image
        if: needs.changes.outputs.worker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 6: Deploy to Staging (develop branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: |
      github.ref == 'refs/heads/develop' && 
      needs.docker-build-push.result == 'success'
    environment:
      name: staging
      url: https://staging.cyberguard.example.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging environment..."
          echo "Images pushed to GHCR:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:develop-${{ github.sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:develop-${{ github.sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:develop-${{ github.sha }}"
          echo "Staging deployment completed"
          # Aquí agregarías tu lógica de deployment real

  # ============================================
  # JOB 7: Release & Deploy to Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: |
      github.ref == 'refs/heads/main' && 
      needs.docker-build-push.result == 'success'
    environment:
      name: production
      url: https://cyberguard.example.com
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Deploy to Production
        run: |
          echo "Deploying to Production environment..."
          echo "Images pushed to GHCR:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:main-${{ github.sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:main-${{ github.sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:main-${{ github.sha }}"
          echo "Production deployment completed"
          # Aquí agregarías tu lógica de deployment real

      - name: Create Release Tag
        run: |
          VERSION="v1.0.$(date +%Y%m%d%H%M%S)"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a $VERSION -m "Release $VERSION - SHA: ${{ github.sha }}"
          git push origin $VERSION
          echo "Released version: $VERSION"

  # ============================================
  # JOB 8: Summary Report
  # ============================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [changes, unit-tests-frontend, unit-tests-backend, unit-tests-worker, integration-tests-backend, integration-tests-worker, integration-tests-frontend, security-scan-frontend, security-scan-backend, security-scan-worker, docker-build-push]
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "## CyberGuard CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Change Detection: ${{ needs.changes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests Frontend: ${{ needs.unit-tests-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests Backend: ${{ needs.unit-tests-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests Worker: ${{ needs.unit-tests-worker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan Frontend: ${{ needs.security-scan-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan Backend: ${{ needs.security-scan-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan Worker: ${{ needs.security-scan-worker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build & Push: ${{ needs.docker-build-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected:" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.changes.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: ${{ needs.changes.outputs.worker }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infra: ${{ needs.changes.outputs.infra }}" >> $GITHUB_STEP_SUMMARY
          echo "- QA: ${{ needs.changes.outputs.qa }}" >> $GITHUB_STEP_SUMMARY